<!doctype html>
<meta charset="utf-8">
<title>BOINC client — Chrome runtime harness (Phase 2)</title>
<style>
  body { font: 13px/1.5 ui-monospace, monospace; max-width: 900px; margin: 1.5rem auto; padding: 0 1rem; }
  h1 { font: 600 1.2rem system-ui; }
  #log { background: #111; color: #ccc; padding: .8rem 1rem; border-radius: 8px; white-space: pre-wrap;
         max-height: 70vh; overflow-y: auto; }
  .err { color: #f66; } .out { color: #9c9; } .sys { color: #89f; } .muted { color: #888; }
  @media (prefers-color-scheme: light) { #log { background:#f4f4f4; color:#222; } }
</style>
<h1>BOINC client — Chrome runtime harness</h1>
<p class="muted">Loads the wasm client in the browser and streams stdout/stderr/exceptions to the
  server (<code>/report</code> → <code>runs.jsonl</code>). Pass args via <code>?args=--version</code>
  (space- or comma-separated); default runs the client with no args.</p>
<div id="log">loading boinc_client.js …</div>

<script>
const $log = document.getElementById('log');
const params = new URLSearchParams(location.search);
const argStr = params.get('args');
const args = argStr ? argStr.split(/[ ,]+/).filter(Boolean) : [];

let seq = 0;
function post(kind, text) {
    const rec = { spike: 'client-smoke', seq: seq++, kind, text: String(text).slice(0, 2000),
                  when: new Date().toISOString(), args };
    try { fetch('/report', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                             body: JSON.stringify(rec) }); } catch (e) {}
}
function show(cls, text) {
    const line = document.createElement('div');
    line.className = cls; line.textContent = text;
    $log.appendChild(line); $log.scrollTop = $log.scrollHeight;
}
function line(kind, cls, text) { show(cls, text); post(kind, text); }

window.addEventListener('error', e =>
    line('window.onerror', 'err', `window.onerror: ${e.message} @ ${e.filename}:${e.lineno}:${e.colno}` +
        (e.error && e.error.stack ? '\n' + e.error.stack : '')));
window.addEventListener('unhandledrejection', e =>
    line('unhandledrejection', 'err', 'unhandledrejection: ' + (e.reason && e.reason.stack || e.reason)));

line('start', 'sys', 'harness start; args = [' + args.join(' ') + ']  crossOriginIsolated=' + self.crossOriginIsolated);

var Module = {
    arguments: args,
    print:    t => line('stdout', 'out', t),
    printErr: t => line('stderr', 'err', t),
    onAbort:  w => line('abort', 'err', 'onAbort: ' + w),
    onExit:   c => line('exit', 'sys', 'runtime exit, code=' + c),
    locateFile: (p) => p,      // .wasm sits next to this page
};

// load the emscripten module; boinc_client.js auto-runs main() using Module.arguments
const s = document.createElement('script');
s.src = 'boinc_client.js';
s.onerror = () => line('loaderror', 'err', 'failed to load boinc_client.js');
document.body.appendChild(s);
</script>
