# Run the wasm app registration once at container start (after makeproject-step3 has set up the
# project). register_wasm_app.sh waits for the project to be ready and is idempotent, so restarts are
# safe. autorestart=false -> one-shot.
[program:wasm-register]
command=/bin/bash -lc "su boincadm -c /wasm-register.sh"
autostart=true
autorestart=false
startsecs=0
priority=999
stdout_logfile=/var/log/wasm-register.log
stderr_logfile=/var/log/wasm-register.log
