# Serve the wasm BOINC client page from the project's own Apache, SAME-ORIGIN as the scheduler and
# downloads. Same-origin means no CORS/preflight is needed; we only need cross-origin isolation
# (COOP/COEP) so the client can use SharedArrayBuffer (the APP_CLIENT_SHM backing).
Alias /wasm /wasm-client
<Directory /wasm-client>
    Require all granted
    Options -Indexes
    # Cross-origin isolation for SharedArrayBuffer / Atomics.
    Header always set Cross-Origin-Opener-Policy   "same-origin"
    Header always set Cross-Origin-Embedder-Policy "require-corp"
    Header always set Cache-Control "no-store"
</Directory>
